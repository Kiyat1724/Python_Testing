<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>
        Booking for {{ competition['name'] }}
    </title>
</head>
<body>
<h2>
{{ competition['name'] }}
</h2>
<p>

Places available :
{{ competition['numberOfPlaces'] }}
</p>

<form action="/purchasePlaces" method="post">
<input
type="hidden"
name="club"
value="{{ club['name'] }}">

<input
type="hidden"
name="competition"
value="{{ competition['name'] }}">
<label>

How many places?
</label>
<input
type="number"
name="places"
min="1"
max="{{ [12, competition['numberOfPlaces']|int]|min }}"
required><button>Book
</button>
</form>
</body>
</html>
